<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google AI 对话</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --google-blue: #4285F4;
            --google-green: #34A853;
            --google-red: #EA4335;
            --google-yellow: #FBBC05;
            --bg-color: #FFFFFF;
            --text-color: #202124;
            --user-msg-bg: linear-gradient(135deg, #4285F4, #34A853);
            --ai-msg-bg: #F1F3F4;
            --border-color: #DADCE0;
            --error-color: #EA4335;
        }

        body {
            font-family: 'Google Sans', 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 20px;
            font-weight: 500;
            background: linear-gradient(135deg, var(--google-blue), var(--google-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 14px;
            background: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--google-blue);
        }

        .btn-clear {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-clear:hover {
            background: #f8f9fa;
            border-color: var(--google-blue);
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #5f6368;
            text-align: center;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 16px;
            max-width: 300px;
        }

        /* Messages */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg-bg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--ai-msg-bg);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
        }

        .message.error {
            align-self: flex-start;
            background: #fce8e6;
            color: var(--error-color);
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        /* Input Area */
        .input-area {
            padding: 16px 24px;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        .btn-upload {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--ai-msg-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .btn-upload:hover {
            background: #e8eaed;
        }

        .btn-upload svg {
            width: 20px;
            height: 20px;
            fill: #5f6368;
        }

        .textarea-wrapper {
            flex: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            min-height: 40px;
            max-height: 120px;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            resize: none;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: var(--google-blue);
            box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.1);
        }

        .btn-send {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--google-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
            flex-shrink: 0;
        }

        .btn-send:hover {
            background: #3367d6;
            transform: scale(1.05);
        }

        .btn-send:active {
            transform: scale(0.95);
        }

        .btn-send svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .btn-send:disabled {
            background: #dadce0;
            cursor: not-allowed;
            transform: none;
        }

        /* Drag & Drop Zone */
        .drag-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(66, 133, 244, 0.1);
            border: 3px dashed var(--google-blue);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        .drag-overlay.active {
            display: flex;
        }

        .drag-text {
            font-size: 24px;
            color: var(--google-blue);
            font-weight: 500;
        }

        /* File Preview */
        .file-preview {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--ai-msg-bg);
            border-radius: 16px;
            margin-bottom: 8px;
            max-width: 80%;
        }

        .file-preview.show {
            display: flex;
        }

        .file-preview-name {
            font-size: 13px;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .file-preview-remove {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-preview-remove svg {
            width: 16px;
            height: 16px;
            fill: #5f6368;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #bbbcbd;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">Google AI 对话</div>
        <div class="header-controls">
            <select id="model-select">
                <option value="gemini-2.0-flash">gemini-2.0-flash</option>
                <option value="gemini-3-flash-preview">gemini-3-flash-preview</option>
            </select>
            <button class="btn-clear" id="btn-clear">清空历史</button>
        </div>
    </header>

    <div class="chat-container" id="chat-container">
        <div class="empty-state" id="empty-state">
            <div class="empty-state-icon">💬</div>
            <div class="empty-state-text">开始对话吧！输入消息或上传文件与 Google AI 交流</div>
        </div>
    </div>

    <div class="input-area">
        <div class="file-preview" id="file-preview">
            <span class="file-preview-name" id="file-name"></span>
            <button class="file-preview-remove" id="btn-remove-file">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
        <div class="input-wrapper">
            <button class="btn-upload" id="btn-upload" title="上传文件">
                <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
            </button>
            <div class="textarea-wrapper">
                <textarea id="message-input" placeholder="输入消息..." rows="1"></textarea>
            </div>
            <button class="btn-send" id="btn-send" title="发送">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
        <input type="file" id="file-input" style="display: none;">
    </div>

    <div class="drag-overlay" id="drag-overlay">
        <div class="drag-text">拖放文件到此处</div>
    </div>

    <script src="api-key.js"></script>
    <script>
        // DOM Elements
        const chatContainer = document.getElementById('chat-container');
        const emptyState = document.getElementById('empty-state');
        const messageInput = document.getElementById('message-input');
        const btnSend = document.getElementById('btn-send');
        const btnUpload = document.getElementById('btn-upload');
        const fileInput = document.getElementById('file-input');
        const filePreview = document.getElementById('file-preview');
        const fileName = document.getElementById('file-name');
        const btnRemoveFile = document.getElementById('btn-remove-file');
        const modelSelect = document.getElementById('model-select');
        const btnClear = document.getElementById('btn-clear');
        const dragOverlay = document.getElementById('drag-overlay');

        // State
        let selectedFile = null;

        // Constants
        const STORAGE_KEY = 'google-ai-chat-history';
        const MAX_HISTORY = 50;

        // Functions
        function init() {
            loadHistory();
            autoResize();
            setupEventListeners();
        }

        function loadHistory() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    const history = JSON.parse(data);
                    chatContainer.removeChild(emptyState);
                    history.forEach(msg => {
                        renderMessage(msg.role, msg.content, msg.isError);
                    });
                }
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }

        function saveHistory() {
            try {
                const messages = [];
                const msgElements = chatContainer.querySelectorAll('.message');
                msgElements.forEach(el => {
                    if (el.classList.contains('user')) {
                        messages.push({ role: 'user', content: el.dataset.content || el.textContent, isError: false });
                    } else if (el.classList.contains('ai')) {
                        messages.push({ role: 'assistant', content: el.dataset.content || el.textContent, isError: false });
                    } else if (el.classList.contains('error')) {
                        messages.push({ role: 'assistant', content: el.textContent, isError: true });
                    }
                });
                // Keep only last MAX_HISTORY messages
                const trimmed = messages.slice(-MAX_HISTORY);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
            } catch (e) {
                console.error('Failed to save history:', e);
            }
        }

        function formatContent(content) {
            if (!content) return '';

            // HTML escape
            let escaped = content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

            // Code blocks: ```language\ncode```
            escaped = escaped.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
                return `<pre><code class="language-${lang}">${code.trim()}</code></pre>`;
            });

            // Inline code: `code`
            escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Newlines to <br>
            escaped = escaped.replace(/\n/g, '<br>');

            return escaped;
        }

        function renderMessage(role, content, isError = false) {
            const div = document.createElement('div');

            if (isError) {
                div.className = 'message error';
            } else if (role === 'user') {
                div.className = 'message user';
            } else {
                div.className = 'message ai';
            }

            div.dataset.content = content;

            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

            if (role === 'user') {
                div.innerHTML = formatContent(content);
            } else {
                div.innerHTML = formatContent(content);
            }

            div.appendChild(time);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return div;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && !selectedFile) return;

            const isEmpty = !text;
            const messageText = text || (selectedFile ? '[图片]' : '');

            // Show user message
            if (!isEmpty) {
                if (chatContainer.contains(emptyState)) {
                    chatContainer.removeChild(emptyState);
                }
                renderMessage('user', messageText);
                messageInput.value = '';
                autoResize();
            }

            // Show loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai loading';
            loadingDiv.innerHTML = '<span class="loading-dots">●●●</span>';
            loadingDiv.style.cssText = 'font-size: 24px; letter-spacing: 4px;';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Disable send button
            btnSend.disabled = true;

            try {
                let imageData = null;
                if (selectedFile) {
                    imageData = await fileToBase64(selectedFile);
                    clearSelectedFile();
                }

                await callGeminiAPI(messageText, imageData, loadingDiv);
            } catch (error) {
                loadingDiv.remove();
                renderMessage('assistant', '错误: ' + error.message, true);
                saveHistory();
            } finally {
                btnSend.disabled = false;
            }
        }

        async function callGeminiAPI(text, imageData, loadingDiv) {
            const model = modelSelect.value;
            const apiKey = window.GOOGLE_AI_API_KEY;

            if (!apiKey) {
                throw new Error('API 密钥未配置');
            }

            // Build request body
            const contents = [];

            if (imageData) {
                // Image request
                contents.push({
                    parts: [
                        { text: text || '描述这张图片' },
                        { inline_data: { mime_type: selectedFile?.type || 'image/png', data: imageData } }
                    ]
                });
            } else {
                // Text-only request
                contents.push({
                    parts: [{ text: text }]
                });
            }

            const requestBody = {
                contents: contents,
                generationConfig: {
                    temperature: 1.0,
                    topP: 0.95,
                    topK: 40,
                    maxOutputTokens: 8192
                }
            };

            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?key=${apiKey}&alt=sse`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                }
            );

            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                throw new Error(error.error?.message || `HTTP ${response.status}`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';

            // Remove loading indicator and create message element
            loadingDiv.remove();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.dataset.content = '';
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            messageDiv.appendChild(timeDiv);
            chatContainer.appendChild(messageDiv);

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed || trimmed === 'data: [DONE]') continue;

                    if (trimmed.startsWith('data: ')) {
                        try {
                            const json = JSON.parse(trimmed.slice(6));
                            const textPart = json.candidates?.[0]?.content?.parts?.find(p => p.text);
                            if (textPart?.text) {
                                fullText += textPart.text;
                                messageDiv.innerHTML = formatContent(fullText);
                                messageDiv.appendChild(timeDiv);
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            }
                        } catch (e) {
                            // Skip malformed JSON
                        }
                    }
                }
            }

            messageDiv.dataset.content = fullText;
            saveHistory();
        }

        function autoResize() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        }

        function setupEventListeners() {
            // Auto resize textarea
            messageInput.addEventListener('input', autoResize);

            // Send on Enter (Shift+Enter for newline)
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Send button
            btnSend.addEventListener('click', sendMessage);

            // File upload
            btnUpload.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);

            // Remove file
            btnRemoveFile.addEventListener('click', clearSelectedFile);

            // Clear history
            btnClear.addEventListener('click', clearHistory);

            // Drag and drop
            document.addEventListener('dragover', handleDragOver);
            document.addEventListener('dragleave', handleDragLeave);
            document.addEventListener('drop', handleDrop);
        }

        function handleFileSelect(e) {
            const file = e.target.files?.[0];
            if (file) {
                selectedFile = file;
                fileName.textContent = file.name;
                filePreview.classList.add('show');
            }
            e.target.value = '';
        }

        function clearSelectedFile() {
            selectedFile = null;
            filePreview.classList.remove('show');
            fileInput.value = '';
        }

        function clearHistory() {
            localStorage.removeItem(STORAGE_KEY);
            const messages = chatContainer.querySelectorAll('.message');
            messages.forEach(m => m.remove());
            if (!chatContainer.contains(emptyState)) {
                chatContainer.appendChild(emptyState);
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
            dragOverlay.classList.add('active');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            dragOverlay.classList.remove('active');
        }

        function handleDrop(e) {
            e.preventDefault();
            dragOverlay.classList.remove('active');
            const file = e.dataTransfer.files?.[0];
            if (file) {
                selectedFile = file;
                fileName.textContent = file.name;
                filePreview.classList.add('show');
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Initialize
        init();
    </script>
</body>
</html>
