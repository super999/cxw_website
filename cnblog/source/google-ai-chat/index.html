<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --google-blue: #4285F4;
            --google-green: #34A853;
            --google-red: #EA4335;
            --google-yellow: #FBBC05;
            --bg-color: #FFFFFF;
            --text-color: #202124;
            --user-msg-bg: linear-gradient(135deg, #4285F4, #34A853);
            --ai-msg-bg: #F1F3F4;
            --border-color: #DADCE0;
            --error-color: #EA4335;
        }

        body {
            font-family: 'Google Sans', 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 20px;
            font-weight: 500;
            background: linear-gradient(135deg, var(--google-blue), var(--google-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 14px;
            background: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--google-blue);
        }

        .btn-clear {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-clear:hover {
            background: #f8f9fa;
            border-color: var(--google-blue);
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #5f6368;
            text-align: center;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 16px;
            max-width: 300px;
        }

        /* Messages */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg-bg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--ai-msg-bg);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
        }

        .message.error {
            align-self: flex-start;
            background: #fce8e6;
            color: var(--error-color);
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        /* Input Area */
        .input-area {
            padding: 16px 24px;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        .btn-upload {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--ai-msg-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .btn-upload:hover {
            background: #e8eaed;
        }

        .btn-upload svg {
            width: 20px;
            height: 20px;
            fill: #5f6368;
        }

        .textarea-wrapper {
            flex: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            min-height: 40px;
            max-height: 120px;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            resize: none;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: var(--google-blue);
            box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.1);
        }

        .btn-send {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--google-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
            flex-shrink: 0;
        }

        .btn-send:hover {
            background: #3367d6;
            transform: scale(1.05);
        }

        .btn-send:active {
            transform: scale(0.95);
        }

        .btn-send svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .btn-send:disabled {
            background: #dadce0;
            cursor: not-allowed;
            transform: none;
        }

        /* Drag & Drop Zone */
        .drag-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(66, 133, 244, 0.1);
            border: 3px dashed var(--google-blue);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        .drag-overlay.active {
            display: flex;
        }

        .drag-text {
            font-size: 24px;
            color: var(--google-blue);
            font-weight: 500;
        }

        /* File Preview */
        .file-preview {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--ai-msg-bg);
            border-radius: 16px;
            margin-bottom: 8px;
            max-width: 80%;
        }

        .file-preview.show {
            display: flex;
        }

        .file-preview-name {
            font-size: 13px;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .file-preview-remove {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-preview-remove svg {
            width: 16px;
            height: 16px;
            fill: #5f6368;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #bbbcbd;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">Google AI Chat</div>
        <div class="header-controls">
            <select id="model-select">
                <option value="gemini-2.0-flash">gemini-2.0-flash</option>
                <option value="gemini-3-flash-preview">gemini-3-flash-preview</option>
            </select>
            <button class="btn-clear" id="btn-clear">清空历史</button>

    </header>

    <div class="chat-container" id="chat-container">

    </div>

    <div class="input-area">

        </div>
        <div class="input-wrapper">

            </button>
            <div class="textarea-wrapper">
                <textarea id="message-input" placeholder="输入消息..." rows="1"></textarea>
            </div>
            <button class="btn-send" id="btn-send" title="发送">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
        <input type="file" id="file-input" style="display: none;">
    </div>

    <div class="drag-overlay" id="drag-overlay">
        <div class="drag-text">拖放文件到此处</div>
    </div>

</body>
</html>
